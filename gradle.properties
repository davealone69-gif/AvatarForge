# AvatarForge :: gradle.properties
#
# The build machine for CI is a 2 GB container: no daemon, no parallel module compilation, and a
# small heap. On a developer machine these can be relaxed, but the defaults below are the ones the
# project is verified with, so they stay.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official

# The Kotlin compiler runs inside the Gradle daemon on low-RAM machines: a separate Kotlin daemon
# (which defaults to another 1.5 GB heap) is what makes a 2 GB container swap and then lose the
# build daemon entirely.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
