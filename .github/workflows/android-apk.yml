name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "arena/**", "fix/**"]

permissions:
  contents: read

concurrency:
  group: avatarforge-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and verify Android packages
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build packages
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/26.1.10909125/shader-tools/linux-x86_64" >> "$GITHUB_PATH"

      - name: GLES shader compilation and table freshness
        run: |
          set -euo pipefail
          command -v glslc
          output="$(python3 tools/embed_shaders.py --check 2>&1)" || {
            echo "$output"
            echo "::error file=tools/embed_shaders.py::$(printf '%s' "$output" | tail -n 1)"
            exit 1
          }
          echo "$output"
          python3 tools/embed_shaders.py
          git diff --exit-code -- native/src/render/af_shaders_gl.h

      - name: Vulkan SPIR-V compilation and table provenance
        run: |
          set -euo pipefail
          python3 tools/test_embed_vulkan_shaders.py
          output="$(python3 tools/embed_vulkan_shaders.py --check 2>&1)" || {
            echo "$output"
            echo "::error file=tools/embed_vulkan_shaders.py::$(printf '%s' "$output" | tail -n 1)"
            exit 1
          }
          echo "$output"
          # --check admits the exact generated bytes or the SHA-pinned current
          # source/table pair after validating every embedded module for vulkan1.3.
          # Do not rewrite a provenance-verified snapshot with this NDK's optimizer.
          git diff --exit-code -- native/src/render/af_shaders_vk.h
          sha256sum native/src/render/af_shaders_gl.h native/src/render/af_shaders_vk.h

      - name: Install host kernel test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev rustc cargo

      - name: Model detail regression tests
        run: bash tools/test_model_host.sh

      - name: Kernel host harness
        run: bash tools/build_host.sh test

      - name: Rust workspace tests
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          AF_CORE_LIB_DIR="$GITHUB_WORKSPACE/build-host" \
            LD_PRELOAD="$GITHUB_WORKSPACE/build-host/libafcore.so" \
            cargo test --manifest-path rust/Cargo.toml --workspace --offline -- --nocapture

      - name: Renderer initialization regression tests
        run: bash tools/test_renderer_host.sh

      - name: Device report parser regressions (mock adb, no device)
        run: bash tools/test_device_check_host.sh

      - name: Renderer library/package linkage guard regressions
        run: python3 tools/test_renderer_artifacts.py

      - name: Unsigned compile-only artifact policy regression
        run: python3 tools/test_compile_only_artifacts.py

      - name: Build ARM64 native libraries from this checkout
        run: |
          set -euo pipefail
          AF_NINJA_JOBS=2 bash tools/build_android.sh arm64-v8a android-26
          for lib in libafcore.so libafrender.so libavatarforge.so; do
            test -s "prebuilt/arm64-v8a/$lib"
            sha256sum "prebuilt/arm64-v8a/$lib"
          done
          python3 tools/verify_gles_artifacts.py prebuilt/arm64-v8a

      - name: SDK JVM regression tests
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain \
            :sdk:testDebugUnitTest \
            -Paf.abIs=arm64-v8a \
            -Paf.prebuiltJni="$GITHUB_WORKSPACE/prebuilt" > sdk-jvm-tests.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            python3 tools/report_jvm_failures.py sdk-jvm-tests.log sdk/build/test-results
            tail -n 120 sdk-jvm-tests.log
            exit "$status"
          fi
          tail -n 20 sdk-jvm-tests.log

      - name: Build debug APK, unsigned release AAB, and SDK AAR
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --console=plain \
            :app:assembleDebug :app:bundleRelease :sdk:assembleRelease \
            -Paf.abIs=arm64-v8a \
            -Paf.prebuiltJni="$GITHUB_WORKSPACE/prebuilt" \
            -Paf.allowUnsignedRelease=true

      - name: Stage and verify artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AvatarForge-debug-arm64.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/AvatarForge-release-UNSIGNED-arm64.aab
          find sdk/build/outputs -type f -name '*.aar' -exec cp {} dist/AvatarForge-sdk.aar \;
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          echo '=== debug APK ==='
          "$AAPT" dump badging dist/AvatarForge-debug-arm64.apk | head -20
          "$APKSIGNER" verify --verbose dist/AvatarForge-debug-arm64.apk
          if "$AAPT" dump permissions dist/AvatarForge-debug-arm64.apk | grep -q 'android.permission.INTERNET'; then
            echo '::error::AvatarForge must remain offline-only; INTERNET permission found.'
            exit 1
          fi
          unzip -l dist/AvatarForge-debug-arm64.apk | grep 'lib/arm64-v8a/libavatarforge.so'
          echo '=== unsigned release AAB (compile verification only) ==='
          unzip -l dist/AvatarForge-release-UNSIGNED-arm64.aab | grep -E 'BundleConfig.pb|base/manifest/AndroidManifest.xml|base/lib/arm64-v8a/libavatarforge.so'
          if unzip -l dist/AvatarForge-release-UNSIGNED-arm64.aab | grep -Eq 'META-INF/.*\.(RSA|DSA|EC)$'; then
            echo '::error::CI release AAB was unexpectedly signed; provenance would be misleading.'
            exit 1
          fi
          python3 tools/verify_gles_artifacts.py dist/AvatarForge-debug-arm64.apk dist/AvatarForge-release-UNSIGNED-arm64.aab dist/AvatarForge-sdk.aar
          (cd dist && sha256sum * > SHA256SUMS)
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          dist = pathlib.Path('dist')
          files = {p.name: {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                   for p in sorted(dist.iterdir()) if p.is_file() and p.name != 'PROVENANCE.json'}
          shader_files = ['native/src/render/af_shaders_gl.h', 'native/src/render/af_shaders_vk.h']
          provenance = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'head_commit': os.environ.get('HEAD_SHA', os.environ['GITHUB_SHA']),
              'shader_tables': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in shader_files},
              'merge_or_push_commit': os.environ['GITHUB_SHA'],
              'ref': os.environ['GITHUB_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'abi': 'arm64-v8a',
              'graphics_backend': 'NATIVE_VULKAN_DEFAULT_GLES_FALLBACK',
              'vulkan_api_target': 'VK_API_VERSION_1_3 (requested target label 1.3.304; patch ignored)',
              'vulkan_shader_target': 'vulkan1.3',
              'vulkan_headers': 'Android NDK 26.1.10909125 / Vulkan-Headers 1.3.237',
              'release_signing': 'UNSIGNED_COMPILE_VERIFICATION_ONLY',
              'files': files,
          }
          (dist / 'PROVENANCE.json').write_text(json.dumps(provenance, indent=2) + '\n')
          PY
          ls -lh dist

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AvatarForge-Android-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
