name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main, work/android-engine-dev]
  push:
    branches: [main, work/android-engine-dev]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: avatarforge-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  glb-fuzz-sanitizers:
    name: Fuzz GLB importer under ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Clang and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build zlib1g-dev

      - name: Generate overflow-focused GLB corpus
        run: python3 native/tests/make_glb_fuzz_corpus.py build-glb-fuzz/corpus

      - name: Build importer with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          set -euo pipefail
          CC=clang CXX=clang++ cmake -S native -B build-glb-fuzz -G Ninja \
            -DAF_BUILD_GLB_FUZZ=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-glb-fuzz --target af_glb_fuzz -j2

      - name: Fuzz overflow-focused corpus
        run: |
          set -euo pipefail
          mkdir -p build-glb-fuzz/artifacts
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            build-glb-fuzz/af_glb_fuzz build-glb-fuzz/corpus \
              -max_total_time=45 -max_len=1048576 -timeout=5 \
              -artifact_prefix=build-glb-fuzz/artifacts/

      - name: Preserve sanitizer crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AvatarForge-GLB-sanitizer-failures-${{ github.sha }}
          path: build-glb-fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  renderer-pixels:
    name: Render real GLES and Vulkan frames
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install headless graphics drivers and validation
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ zlib1g-dev libegl1-mesa-dev libgles2-mesa-dev \
            mesa-vulkan-drivers libvulkan-dev vulkan-validationlayers libx11-dev xvfb xauth

      - name: Assert real GLES pixels at desktop and mobile UBO alignments
        run: |
          mkdir -p renderer-test-logs
          bash tools/test_renderer.sh 2>&1 | tee renderer-test-logs/gles.txt

      - name: Assert Vulkan pixels and synchronization validation
        run: bash tools/test_renderer_vk.sh 2>&1 | tee renderer-test-logs/vulkan.txt

      - name: Preserve renderer regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AvatarForge-renderer-tests-${{ github.sha }}
          path: renderer-test-logs/
          if-no-files-found: warn
          retention-days: 14

  build-apk:
    name: Build and verify Android packages
    needs: renderer-pixels
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # "tools" is no longer a valid sdkmanager package on current SDK repositories.
          packages: "platform-tools"

      - name: Install Rust toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cargo rustc

      - name: Install Android build packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Run full host regression, shader, GLB, ABI, and Rust workspace checks
        run: bash tools/verify.sh

      - name: Configure optional release signing
        if: github.event_name != 'pull_request'
        id: release_signing
        env:
          AF_RELEASE_KEYSTORE_BASE64: ${{ secrets.AF_RELEASE_KEYSTORE_BASE64 }}
          AF_RELEASE_STORE_PASSWORD: ${{ secrets.AF_RELEASE_STORE_PASSWORD }}
          AF_RELEASE_KEY_ALIAS: ${{ secrets.AF_RELEASE_KEY_ALIAS }}
          AF_RELEASE_KEY_PASSWORD: ${{ secrets.AF_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${AF_RELEASE_KEYSTORE_BASE64:-}" && -n "${AF_RELEASE_STORE_PASSWORD:-}" &&
                -n "${AF_RELEASE_KEY_ALIAS:-}" && -n "${AF_RELEASE_KEY_PASSWORD:-}" ]]; then
            mkdir -p "$RUNNER_TEMP/avatarforge-signing"
            printf '%s' "$AF_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/avatarforge-signing/release.jks"
            {
              printf 'storeFile=%s\n' "$RUNNER_TEMP/avatarforge-signing/release.jks"
              printf 'storePassword=%s\n' "$AF_RELEASE_STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$AF_RELEASE_KEY_ALIAS"
              printf 'keyPassword=%s\n' "$AF_RELEASE_KEY_PASSWORD"
            } > keystore.properties
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            rm -f keystore.properties
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets are not configured; release APK/AAB packaging is skipped."
          fi

      - name: Require real signing for version tags
        if: startsWith(github.ref, 'refs/tags/v') && steps.release_signing.outputs.available != 'true'
        run: |
          echo "::error::Version tags require all four AF_RELEASE_* signing secrets."
          exit 1

      - name: Compile native sources, run unit tests, and build APKs/AAR
        env:
          RELEASE_SIGNING_AVAILABLE: ${{ steps.release_signing.outputs.available }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          TASKS=( :app:testDebugUnitTest :sdk:testReleaseUnitTest :app:assembleDebug :sdk:assembleRelease )
          if [[ "$RELEASE_SIGNING_AVAILABLE" == "true" ]]; then
            TASKS+=( :app:assembleRelease :app:bundleRelease )
          fi
          ./gradlew --no-daemon --stacktrace --console=plain "${TASKS[@]}" -Paf.abIs=arm64-v8a

      - name: Stage easy-download artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AvatarForge-debug-arm64.apk
          find sdk/build/outputs -type f -name '*.aar' -exec cp {} dist/AvatarForge-sdk.aar \;
          if [[ -s app/build/outputs/apk/release/app-release.apk ]]; then
            cp app/build/outputs/apk/release/app-release.apk dist/AvatarForge-release-arm64.apk
          fi
          if [[ -s app/build/outputs/bundle/release/app-release.aab ]]; then
            cp app/build/outputs/bundle/release/app-release.aab dist/AvatarForge-release-arm64.aab
          fi
          test -s dist/AvatarForge-debug-arm64.apk
          test -s dist/AvatarForge-sdk.aar
          ls -lh dist

      - name: Audit APK permissions and native ABI
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          shopt -s nullglob
          APKS=(dist/*.apk)
          test "${#APKS[@]}" -gt 0
          for apk in "${APKS[@]}"; do
            echo "=== $apk ==="
            "$APKSIGNER" verify --verbose "$apk"
            "$AAPT" dump badging "$apk" | grep "package: name='com.avatarforge'"
            "$AAPT" dump permissions "$apk"
            if "$AAPT" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
              echo "::error::AvatarForge must remain offline-only; INTERNET permission found."
              exit 1
            fi
            unzip -l "$apk" | grep 'lib/arm64-v8a/libavatarforge.so'
          done

      - name: Upload APKs for direct download
        uses: actions/upload-artifact@v4
        with:
          name: AvatarForge-Android-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AvatarForge ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/AvatarForge-debug-arm64.apk
            dist/AvatarForge-release-arm64.apk
            dist/AvatarForge-release-arm64.aab
            dist/AvatarForge-sdk.aar
