name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "arena/bf31ed07-avatarforge"]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: avatarforge-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and verify Android packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # "tools" is no longer a valid sdkmanager package on current SDK repositories.
          packages: "platform-tools"

      - name: Install Android build packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Prepare CI debug signing key for installable release APK
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      # NOTE: the native libraries are compiled from source in the step below (Gradle drives
      # CMake via :sdk's externalNativeBuild). The prebuilt/arm64-v8a/*.so committed to the repo
      # are a convenience for low-RAM local machines (see BUILD.md) and are deliberately NOT
      # used in CI: they go stale the moment native/ changes, and shipping them is exactly how
      # the 2026-10-25 device-corruption bug survived "fixed" renderer commits (see
      # docs/AUDIT_2026-10-25.md, finding F1).

      - name: Build debug APK, release APK, and SDK AAR (native from source)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --console=plain \
            :app:assembleDebug :app:assembleRelease :sdk:assembleRelease \
            -Paf.abIs=arm64-v8a \
            -Paf.parallel=4

      - name: Stage easy-download artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AvatarForge-debug-arm64.apk
          cp app/build/outputs/apk/release/app-release.apk dist/AvatarForge-release-arm64.apk
          find sdk/build/outputs -type f -name '*.aar' -exec cp {} dist/AvatarForge-sdk.aar \;
          test -s dist/AvatarForge-debug-arm64.apk
          test -s dist/AvatarForge-release-arm64.apk
          ls -lh dist

      - name: Audit APK permissions and native ABI
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          for apk in dist/AvatarForge-debug-arm64.apk dist/AvatarForge-release-arm64.apk; do
            echo "=== $apk ==="
            "$AAPT" dump permissions "$apk"
            if "$AAPT" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
              echo "::error::AvatarForge must remain offline-only; INTERNET permission found."
              exit 1
            fi
            unzip -l "$apk" | grep 'lib/arm64-v8a/libavatarforge.so'
          done

      - name: Upload APKs for direct download
        uses: actions/upload-artifact@v4
        with:
          name: AvatarForge-Android-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AvatarForge ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/AvatarForge-debug-arm64.apk
            dist/AvatarForge-release-arm64.apk
            dist/AvatarForge-sdk.aar
