name: GLB measurement tests

on:
  push:
    branches:
      - work/glb-measurement-pipeline
    paths:
      - "tools/glb_measurements.py"
      - "tools/tests/**"
      - ".github/workflows/glb-measurements.yml"
  pull_request:
    paths:
      - "tools/glb_measurements.py"
      - "tools/tests/**"
      - ".github/workflows/glb-measurements.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile extractor and tests
        run: python -m py_compile tools/glb_measurements.py tools/tests/test_glb_measurements.py
      - name: Run regression tests
        run: python -m unittest discover -s tools/tests -p "test_*.py" -v
