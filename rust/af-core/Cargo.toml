# ==============================================================================================
#  AvatarForge :: af-core  --  the Rust native core
# ==============================================================================================
#  `crate-type` is both a uniquely named cdylib (`libafcore_rust.so`) and rlib. The distinct
#  filename keeps Cargo's workspace test loader from shadowing the C++ reference `libafcore.so`;
#  the exported C symbols still implement the same ABI.
#
#  No dependencies, by design: `cargo build --offline` works on a machine with no registry access,
#  which is the same constraint the phone runs under.
# ==============================================================================================
[package]
name = "af-core"
description = "Rust native core implementing the AvatarForge afcore C ABI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "afcore_rust"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
